{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card text-center shadow-sm border-0">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="bi bi-bell-slash" style="font-size: 80px; color: #d92d20;"></i>
                    </div>
                    <h2 class="mb-3">See Your Notifications</h2>
                    <p class="text-muted mb-4" style="max-width: 400px; margin: 0 auto;">
                        Sign in to view your notifications, order updates, and special offers.
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a href="{% url 'products:login' %}" class="btn btn-primary btn-lg px-4">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </a>
                        <a href="{% url 'products:register' %}" class="btn btn-outline-primary btn-lg px-4">
                            <i class="bi bi-person-plus"></i> Create Account
                        </a>
                    </div>
                    <hr class="my-4" style="max-width: 300px; margin: 30px auto;">
                    <p class="text-muted small">
                        <i class="bi bi-shield-check"></i> Your notifications are private and secure
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
