{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Notifications</h5>
                    <hr>
                    <div class="list-group">
                        <button class="list-group-item list-group-item-action filter-btn active" data-type="all">
                            All <span class="badge bg-primary float-end" id="total-count">0</span>
                        </button>
                        <button class="list-group-item list-group-item-action filter-btn" data-type="unread">
                            Unread <span class="badge bg-danger float-end" id="unread-count">0</span>
                        </button>
                        <button class="list-group-item list-group-item-action filter-btn" data-type="order">
                            Orders <span class="badge bg-info float-end" id="order-count">0</span>
                        </button>
                        <button class="list-group-item list-group-item-action filter-btn" data-type="promotion">
                            Promotions <span class="badge bg-success float-end" id="promotion-count">0</span>
                        </button>
                        <button class="list-group-item list-group-item-action filter-btn" data-type="system">
                            System <span class="badge bg-warning float-end" id="system-count">0</span>
                        </button>
                    </div>
                    <hr>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary btn-sm" id="mark-all-read">
                            <i class="bi bi-check2-all"></i> Mark All as Read
                        </button>
                        <button class="btn btn-outline-danger btn-sm" id="clear-all">
                            <i class="bi bi-trash"></i> Clear All
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-body">
                    <h6>Notification Settings</h6>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="sound-toggle">
                        <label class="form-check-label" for="sound-toggle">Sound Notifications</label>
                    </div>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="desktop-toggle">
                        <label class="form-check-label" for="desktop-toggle">Desktop Notifications</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-9">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0" id="notification-title">All Notifications</h5>
                </div>
                <div class="card-body" id="notifications-list" style="max-height: 600px; overflow-y: auto;">
                    <div class="text-center text-muted py-5" id="loading">
                        <div class="spinner-border text-primary"></div>
                        <p class="mt-2">Loading notifications...</p>
                    </div>
                </div>
                <div class="card-footer" id="pagination">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentType = 'all';
let isLoading = false;

// Load notifications
async function loadNotifications() {
    if (isLoading) return;
    isLoading = true;
    
    try {
        const response = await fetch(`/products/api/notifications/?page=${currentPage}&type=${currentType}`);
        const data = await response.json();
        
        if (data.success) {
            renderNotifications(data.notifications);
            renderPagination(data);
            updateCounts();
        }
    } catch (error) {
        console.error('Error loading notifications:', error);
    } finally {
        isLoading = false;
        document.getElementById('loading').style.display = 'none';
    }
}

// Render notifications
function renderNotifications(notifications) {
    const container = document.getElementById('notifications-list');
    
    if (notifications.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-5">
                <i class="bi bi-bell-slash" style="font-size: 48px;"></i>
                <p class="mt-3">No notifications found</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = notifications.map(notif => `
        <div class="notification-item border-bottom p-3 ${notif.is_read ? '' : 'bg-light'}" data-id="${notif.id}">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center mb-2">
                        ${getNotificationIcon(notif.type)}
                        <strong class="me-2">${escapeHtml(notif.title)}</strong>
                        ${!notif.is_read ? '<span class="badge bg-danger ms-2">New</span>' : ''}
                        <small class="text-muted ms-auto">${formatDate(notif.created_at)}</small>
                    </div>
                    <p class="mb-1">${escapeHtml(notif.message)}</p>
                </div>
                <div class="btn-group-vertical">
                    ${!notif.is_read ? `<button class="btn btn-sm btn-link mark-read-btn" data-id="${notif.id}"><i class="bi bi-envelope-open"></i></button>` : ''}
                    <button class="btn btn-sm btn-link text-danger delete-btn" data-id="${notif.id}"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        </div>
    `).join('');
    
    // Add event listeners
    document.querySelectorAll('.mark-read-btn').forEach(btn => {
        btn.addEventListener('click', () => markAsRead(btn.dataset.id));
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteNotification(btn.dataset.id));
    });
}

function getNotificationIcon(type) {
    const icons = {
        'success': '<i class="bi bi-check-circle-fill text-success me-2"></i>',
        'error': '<i class="bi bi-x-circle-fill text-danger me-2"></i>',
        'warning': '<i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>',
        'info': '<i class="bi bi-info-circle-fill text-info me-2"></i>',
        'order': '<i class="bi bi-cart-check-fill text-primary me-2"></i>',
        'promotion': '<i class="bi bi-gift-fill text-success me-2"></i>',
        'system': '<i class="bi bi-gear-fill text-secondary me-2"></i>'
    };
    return icons[type] || icons['info'];
}

async function markAsRead(notificationId) {
    try {
        const response = await fetch(`/products/api/notifications/mark-read/${notificationId}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        
        if (response.ok) {
            loadNotifications();
            updateUnreadCount();
        }
    } catch (error) {
        console.error('Error marking as read:', error);
    }
}

async function deleteNotification(notificationId) {
    if (!confirm('Delete this notification?')) return;
    
    try {
        const response = await fetch(`/products/api/notifications/delete/${notificationId}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        
        if (response.ok) {
            loadNotifications();
            updateUnreadCount();
            showToast('Notification deleted', 'info');
        }
    } catch (error) {
        console.error('Error deleting:', error);
    }
}

document.getElementById('mark-all-read')?.addEventListener('click', async () => {
    try {
        const response = await fetch('/products/api/notifications/mark-all-read/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        
        if (response.ok) {
            loadNotifications();
            updateUnreadCount();
            showToast('All notifications marked as read', 'success');
        }
    } catch (error) {
        console.error('Error:', error);
    }
});

document.getElementById('clear-all')?.addEventListener('click', async () => {
    if (!confirm('Delete ALL notifications? This cannot be undone.')) return;
    
    try {
        const response = await fetch('/products/api/notifications/clear-all/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });
        
        if (response.ok) {
            loadNotifications();
            updateUnreadCount();
            showToast('All notifications cleared', 'success');
        }
    } catch (error) {
        console.error('Error:', error);
    }
});

async function updateCounts() {
    try {
        const response = await fetch('/products/api/notifications/');
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('total-count').textContent = data.total;
            
            const orderCount = data.notifications.filter(n => n.type === 'order').length;
            const promotionCount = data.notifications.filter(n => n.type === 'promotion').length;
            const systemCount = data.notifications.filter(n => n.type === 'system').length;
            
            document.getElementById('order-count').textContent = orderCount;
            document.getElementById('promotion-count').textContent = promotionCount;
            document.getElementById('system-count').textContent = systemCount;
        }
    } catch (error) {
        console.error('Error updating counts:', error);
    }
}

async function updateUnreadCount() {
    try {
        const response = await fetch('/products/api/notifications/unread/count/');
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('unread-count').textContent = data.unread_count;
        }
    } catch (error) {
        console.error('Error updating unread count:', error);
    }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        currentType = btn.dataset.type === 'unread' ? 'all' : btn.dataset.type;
        currentPage = 1;
        
        if (btn.dataset.type === 'unread') {
            loadUnreadOnly();
        } else {
            loadNotifications();
        }
    });
});

async function loadUnreadOnly() {
    if (isLoading) return;
    isLoading = true;
    
    try {
        const response = await fetch(`/products/api/notifications/?page=${currentPage}&is_read=false`);
        const data = await response.json();
        
        if (data.success) {
            renderNotifications(data.notifications);
            renderPagination(data);
        }
    } catch (error) {
        console.error('Error loading unread:', error);
    } finally {
        isLoading = false;
        document.getElementById('loading').style.display = 'none';
    }
}

function renderPagination(data) {
    const container = document.getElementById('pagination');
    if (data.total_pages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let html = '<nav><ul class="pagination justify-content-center mb-0">';
    
    if (data.current_page > 1) {
        html += `<li class="page-item"><button class="page-link" data-page="${data.current_page - 1}">Previous</button></li>`;
    }
    
    for (let i = 1; i <= Math.min(5, data.total_pages); i++) {
        html += `<li class="page-item ${i === data.current_page ? 'active' : ''}">
                    <button class="page-link" data-page="${i}">${i}</button>
                </li>`;
    }
    
    if (data.current_page < data.total_pages) {
        html += `<li class="page-item"><button class="page-link" data-page="${data.current_page + 1}">Next</button></li>`;
    }
    
    html += '</ul></nav>';
    container.innerHTML = html;
    
    document.querySelectorAll('.page-link').forEach(btn => {
        btn.addEventListener('click', () => {
            currentPage = parseInt(btn.dataset.page);
            loadNotifications();
        });
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} minute${diffMins === 1 ? '' : 's'} ago`;
    if (diffHours < 24) return `${diffHours} hour${diffHours === 1 ? '' : 's'} ago`;
    if (diffDays < 7) return `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
    return date.toLocaleDateString();
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadNotifications();
    updateUnreadCount();
});
</script>

<style>
.notification-item {
    transition: background-color 0.3s ease;
    cursor: pointer;
}

.notification-item:hover {
    background-color: #f8f9fa;
}

[data-theme="dark"] .notification-item:hover {
    background-color: #2a2a2a;
}

.filter-btn.active {
    background-color: #d92d20;
    color: white;
    border-color: #d92d20;
}
</style>
{% endblock %}
