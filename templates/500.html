<!doctype html>
{# Self-contained on purpose: shown when the app itself has failed, so no base template, DB or context processors. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | RedCart</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f5f5f6; color: #111827; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 40px 28px; }
    .logo { font-size: 1.6rem; font-weight: 800; margin-bottom: 1.5rem; }
    .logo b { color: #d92d20; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: #6b7280; line-height: 1.6; margin: 0 0 1.5rem; }
    a { display: inline-block; padding: .75rem 1.25rem; border-radius: 6px; background: #d92d20; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #f3f4f6; }
      main { background: #171a21; border-color: #2a2f3a; }
      p { color: #9ca3af; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">Red<b>Cart</b></div>
    <h1>Something went wrong on our side</h1>
    <p>Sorry about that. Please try again in a moment — your cart and account are safe.</p>
    <a href="/products/">Back to the store</a>
  </main>
</body>
</html>
