<!doctype html>
{# Shared layout for every RedCart email. Inline styles + tables because email clients ignore <style> and modern CSS. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{% block title %}RedCart{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f6;font-family:Arial,Helvetica,sans-serif;color:#111827;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f6;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
        <tr><td style="padding:22px 28px;border-bottom:1px solid #e5e7eb;">
          <a href="{{ site_url }}/products/" style="text-decoration:none;font-size:22px;font-weight:800;color:#111827;">Red<span style="color:#d92d20;">Cart</span></a>
        </td></tr>

        <tr><td style="padding:28px 28px 8px;">
          <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;color:#111827;">{% block heading %}{% endblock %}</h1>
          <div style="font-size:15px;line-height:1.65;color:#374151;">
            {% block content %}{% endblock %}
          </div>
        </td></tr>

        {% block cta_row %}{% endblock %}

        <tr><td style="padding:8px 28px 28px;">
          <div style="padding:12px 14px;border:1px solid #fedf89;border-radius:8px;background:#fffaeb;font-size:13px;line-height:1.6;color:#374151;">
            <strong>Stay safe:</strong> RedCart will never ask for your card PIN, OTP or password, and we never ask you to pay into a personal account.
            <a href="{{ site_url }}/products/stay-safe/" style="color:#d92d20;font-weight:600;">Learn more</a>
          </div>
        </td></tr>

        <tr><td style="padding:18px 28px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.6;color:#6b7280;">
          Need help? {% if support_email %}Email <a href="mailto:{{ support_email }}" style="color:#6b7280;">{{ support_email }}</a> or {% endif %}visit our <a href="{{ site_url }}/products/contact/" style="color:#6b7280;">help page</a>.<br>
          {% block footer_extra %}{% endblock %}
          &copy; {% now "Y" %} RedCart · Delivered across Nigeria
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
